# Optimizations OFF until a run works (per XenonRecomp guidance; same policy as the
# Fable 2 and Asura's Wrath ports — turning these on before the boot is correct makes
# every divergence twice as hard to localise).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers, found by `tools/find_save_restore.py` (byte-pattern
# scan of the loaded image, 2026-08-04). Sizes verified against XenonRecomp's own
# formulas in `Recompiler::Analyse()`, and the four vector ladders are contiguous —
# each ends exactly where the next begins — which is the cross-check that they are the
# real ladders and not an 18-rung suffix of a 64-rung one.
#
# Note the gpr ladders are r1-based here (`std r14,-0x98(r1)`) while the fpr ladders
# are r12-based; both idioms occur across titles and XenonRecomp does not care, but a
# scanner with the base register hardcoded will report half of them missing.
savegprlr_14_address = 0x8280FED0
restgprlr_14_address = 0x8280FF20
savefpr_14_address   = 0x82810000
restfpr_14_address   = 0x8281004C
savevmx_14_address   = 0x82815190
savevmx_64_address   = 0x82815224
restvmx_14_address   = 0x82815428
restvmx_64_address   = 0x828154BC

