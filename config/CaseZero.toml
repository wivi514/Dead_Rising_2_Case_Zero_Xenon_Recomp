# Dead Rising 2: Case Zero — XenonRecomp main config.
#
# Title: Dead Rising 2: Case Zero (Capcom / Blue Castle Games, 2010), XBLA arcade title
# 58410A8D. Shipped as an STFS package, not a disc — unpack it with
# `tools/extract_stfs.py` before anything here will work.
#
# XEX identity (established 2026-08-04, see docs/bootstrap-2026-08-04.md):
#   image base   0x82000000      entry point 0x825D9F30
#   image size   0xB40000        .text 0x82150000 + 0x873564
#   encryption 1 (**devkit / all-zero key**, NOT the retail key), compression 2 (LZX).
#
# The devkit key is the trap here: stock XenonRecomp hardcodes the retail key and
# returns an empty Image with no diagnostic when it is wrong. This repo carries the
# fix in XenonRecomp (`Xex2LoadImage` now tries both keys) — see
# docs/xenonrecomp-upstream-bugs.md. Recompiling with an unpatched XenonRecomp will
# fail; that is the first thing to check if the run below produces nothing.
[main]
# Switch-tail repairs, generated by `tools/fix_switch_function_bounds.py --apply`
# (2026-08-04, first pass: 28 functions, one round to a fixpoint).
#
# XenonRecomp's boundary analysis ends each of these functions at its jump-table
# `bctr`, so every case body falls outside the function and is lowered to a bare
# `return;` — no epilogue, so the caller resumes with the callee's non-volatiles.
# It is not a compile error and nothing detects it at runtime; the recompiler only
# says "Switch case at X is trying to jump outside function". Manual entries here are
# registered before .pdata parsing and take precedence.
#
# Regenerate after any change to the switch tables:
#   python3 tools/fix_switch_function_bounds.py --apply
# then re-run XenonRecomp and confirm the log has zero "jump outside function" lines.
#
# THIS LIST HAS THREE SOURCES THAT MERGE, NEVER REPLACE (139 entries, address-sorted):
#   1. tools/fix_switch_function_bounds.py --apply   switch-tail repairs
#   2. tools/coverage_to_function_overrides.py       entry points recovered from the
#                                                    C1/C2 Xenia coverage traces
#   3. tools/find_dropped_branches.py --widen        truncated functions widened over
#                                                    their outlined cold blocks
# Where two sources name the same address the LARGER size wins, so they compose in any
# order. Run them against a `ppc/` regenerated from THIS file — every one of them reads
# the emitted code to decide what is missing, so a stale ppc/ makes all three
# under-report silently.
#
# (2) also *removes* entries: `find_dropped_branches.py --prune` deleted 9 addresses the
# coverage pass had added, which were loop headers rather than functions and had split
# 9 real functions in half. See docs/xenia-capture-analysis.md findings 5d and 13 —
# nothing detects that except the dropped-branch check, so run it after any change here.
