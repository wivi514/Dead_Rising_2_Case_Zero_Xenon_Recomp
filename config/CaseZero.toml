# The `functions` list above will also grow entries recovered from Xenia
# function-coverage traces: guest functions hardware executed that static analysis
# never found, because they are reached only through vtable slots and runtime-built
# function-pointer tables, so no `bl` points at them and they carry no .pdata record.
# Without them the image has no `sub_<addr>` and PPC_CALL_INDIRECT_FUNC dies at
# runtime. Both template ports needed this (Asura's Wrath: 215 of them). Nothing here
# yet — it needs a capture; see docs/xenia-capture-requests.md.
